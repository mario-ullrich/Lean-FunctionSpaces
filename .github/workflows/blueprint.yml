# Builds the Lean project and the leanblueprint, then publishes the result
# three ways:
#
#   * GitHub Pages (public repository): the rendered blueprint is deployed to
#     https://<owner>.github.io/Lean-FunctionSpaces/ with the PDF at
#     https://<owner>.github.io/Lean-FunctionSpaces/blueprint.pdf.
#     While the repository is private, the deploy job is skipped (Pages is
#     unavailable on the free plan for private repositories).
#
#   * Branch `blueprint-build` (always): the PDF and the dependency graphs as
#     SVG images, which GitHub shows in the browser, also in a private
#     repository.
#
#   * Workflow artifact (always): `blueprint-YYYYMMDD` is downloadable from
#     every run summary under the Actions tab. It contains the PDF, the
#     graph images and the web pages.

name: Build blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.stamp.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # GitHub-hosted runners start with roughly 20 GB free on `/`, and both
      # `~/.elan` and the workspace live there. A Lean toolchain, the Mathlib
      # oleans and TeX Live together do not fit next to the preinstalled
      # language toolchains, so drop the ones this project never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      # Exact key only, no `restore-keys`: on a Mathlib bump the fallback would
      # restore the *previous* toolchain and olean set, and the new ones would
      # then have to fit alongside them.
      - name: Cache Lean toolchain and Lake artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-lean-${{ hashFiles('lake-manifest.json') }}

      # ----- Lean side: build the project so that the declaration check can
      # verify each `\lean{Decl}` tag against the actually-existing declaration.
      - name: Install elan (Lean version manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Use the Mathlib revision pinned in lake-manifest.json (do NOT run
      # `lake update`: that pulls bleeding-edge Mathlib, making CI builds
      # non-reproducible and breaking them whenever Mathlib changes upstream).
      - name: Download Mathlib cache (pinned by lake-manifest.json)
        run: lake exe cache get || true

      - name: Build the Lean project
        run: lake build

      # ----- Blueprint side: TeX, graphviz, leanblueprint
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install TeX Live and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            latexmk dvisvgm graphviz libgraphviz-dev

      - name: Install leanblueprint
        run: |
          python -m pip install --upgrade pip
          pip install leanblueprint

      - name: Build blueprint PDF
        run: leanblueprint pdf
        continue-on-error: true   # PDF is nice-to-have; don't break the build if TeX hiccups

      - name: Build blueprint web
        run: leanblueprint web

      # Thin out the dependency graph: the helper lemmas (used by one result of
      # their chapter) are left out with their arrows passed through, all edges
      # are solid, and the source is sorted, so that every build lays the graph
      # out the same way. A second page, dep_graph_grouped.html, shows the same
      # graph with frames for the blocks of the project (those of the README,
      # some split into parts), stacked in columns; each page links to the
      # other. Both zoom further in than d3-graphviz's default allows. The
      # script's docstring has the details, and it fails if a node falls in no
      # block.
      - name: Thin out the dependency graph and add a grouped version
        run: python blueprint/scripts/tidy_dep_graph.py

      # Tidy both dependency-graph pages. plastexdepgraph exposes no options
      # for this, so we post-process the generated pages:
      #   * Recolor the "ready to formalize" nodes from blue (#A3D6FF) to white,
      #     so the graph reads two-tone: green = proof formalized, white = the
      #     statement is formalized (green border) but the proof is still a `sorry`.
      #   * Drop the legend rows that never apply here: "Orange border" and
      #     "Blue border" (every statement is formalized, so no node has either)
      #     and "Blue background" (now recolored white; the green-border row
      #     already explains a stated-but-unproved node).
      - name: Tidy dependency graph (recolor sorry-nodes white, drop unused legend rows)
        run: |
          sed -i 's/#A3D6FF/#FFFFFF/g; /<dt>Orange border<\/dt>/d; /<dt>Blue border<\/dt>/d; /<dt>Blue background<\/dt>/d' blueprint/web/dep_graph_document.html blueprint/web/dep_graph_grouped.html

      # Draw both graphs as SVG images, dep_graph.svg and dep_graph_grouped.svg,
      # with the pages' own Graphviz build run under Node, so that they show the
      # same pictures as the pages. GitHub displays them, also while the
      # repository is private; the job publish-files puts them on a branch. The
      # script's comments have the details.
      - name: Draw the dependency graphs as SVG images
        run: node blueprint/scripts/dep_graph_svg.js

      # Point the `\lean{...}` links at this repository. leanblueprint builds
      # them as `{dochome}/find/#doc/Decl` and, with no `\dochome` set, falls
      # back to Mathlib's documentation site, where none of this project's
      # declarations exist. That URL shape is fixed inside the plugin, so the
      # links are rewritten here into permalinks at the commit being built.
      # The script fails the build if a cited declaration cannot be located, or
      # if it finds no links at all -- which is how an upstream template change
      # would show up.
      - name: Link Lean declarations to their sources
        run: |
          python blueprint/scripts/link_lean_decls.py \
            --repo "$GITHUB_REPOSITORY" \
            --rev "$GITHUB_SHA"

      # The dependency graph drawn from the compiled Lean code: its arrows are
      # read off the proofs. The pages in blueprint/graph/ (the views Flow and
      # Rings, with the data in data.json) go to graph/ on the site, and the menu
      # entry "Dependency graph" of every page leads there. The graphs
      # leanblueprint draws from the `\uses` of the blueprint stay on the site
      # under their names, and the title page links both kinds below the author.
      # dep_graph_overview.html holds the main results in their blocks as
      # Graphviz source, for the picture on the Lean page of the homepage. The
      # check fails the build if the menu entry was not found.
      - name: Publish the dependency graph from the Lean code, keep the leanblueprint graphs
        run: |
          cp -r blueprint/graph blueprint/web/graph
          sed -i 's#^<li ><a href="dep_graph_document.html">Dependency graph</a></li>$#<li ><a href="graph/flow.html">Dependency graph</a></li>#' blueprint/web/*.html
          sed -i 's#<span class="author">Mario Ullrich</span>#&</p>\n<p class="repo-link">GitHub: <a href="https://github.com/mario-ullrich/Lean-FunctionSpaces">Lean-FunctionSpaces</a></p>\n<p class="repo-link"><a href="graph/flow.html">Dependency graph</a>, <a href="dep_graph_document.html">leanblueprint version</a>#' blueprint/web/index.html
          python blueprint/scripts/graph_overview_page.py
          grep -q 'href="graph/flow.html">Dependency graph</a></li>' blueprint/web/index.html

      # Fatal on purpose: a blueprint that cites a declaration the project no
      # longer has is wrong, and a step that only reports can itself break
      # unnoticed. The script performs the check of `leanblueprint checkdecls`
      # inside Lean itself; its docstring says why the `checkdecls` executable
      # cannot be used.
      - name: Verify Lean declaration references
        run: python blueprint/scripts/check_lean_decls.py

      # Bundle the PDF with the web artifact, so one download has both.
      - name: Include the PDF in the web bundle
        run: |
          if [ -f blueprint/print/print.pdf ]; then
            cp blueprint/print/print.pdf blueprint/web/blueprint.pdf
          fi

      # ----- Upload as a workflow artifact (downloadable from the run page).
      # The artifact contains the PDF and the web pages.
      - name: Name the artifact after the build date
        id: stamp
        run: echo "name=blueprint-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload blueprint (HTML site with blueprint.pdf)
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.stamp.outputs.name }}
          path: blueprint/web/
          retention-days: 30

      # Same directory again, packaged in the special format deploy-pages
      # expects (upload-artifact ZIPs are not compatible with Pages).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

  # ----- Put the PDF and the two graph images on the branch `blueprint-build`.
  # GitHub shows PDF and SVG files in the browser, also in a private repository,
  # where Pages (the web pages and the interactive graph) is unavailable on the
  # free plan. The branch holds a single commit, replaced on every run, so the
  # repository does not grow with each build; its README names the commit of
  # `main` it was built from. Without a PDF (its build step may fail) the job
  # stops, and the branch keeps the previous version.
  publish-files:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: blueprint-build
      cancel-in-progress: false
    steps:
      - name: Download the blueprint artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: site

      - name: Push the PDF and the graph images to blueprint-build
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp site/blueprint.pdf site/dep_graph.svg site/dep_graph_grouped.svg out/
          cd out
          cat > README.md <<EOF
          # Blueprint of ${GITHUB_REPOSITORY#*/}

          Built by GitHub Actions on $(date -u +%Y-%m-%d) from commit
          [${GITHUB_SHA::7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) of main.

          * [blueprint.pdf](blueprint.pdf): the blueprint
          * [dep_graph.svg](dep_graph.svg): the dependency graph
          * [dep_graph_grouped.svg](dep_graph_grouped.svg): the same graph, grouped into the
            blocks of the README

          GitHub shows the images scaled to the window; *Raw* opens them at full size.
          EOF
          git init -q -b blueprint-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Blueprint of ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" blueprint-build

  # ----- Deploy the rendered blueprint to GitHub Pages. Skipped while the
  # repository is private; once it is public, the next push to main (or a
  # manual workflow_dispatch run) deploys. configure-pages enables Pages
  # with source "GitHub Actions" automatically on the first run.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
