name = "functionspaces"
defaultTargets = ["ApproximationSpaces", "FunctionSpaces"]

# Mathlib pinned to the v4.35.0-rc2 tag, matching lean-toolchain: a release tag has a
# fully-published build cache, so `lake exe cache get` finds every olean.
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.35.0-rc2"

# The abstract theory of approximation spaces in the sense of Pietsch: approximation
# schemes in a normed space, the errors of best approximation, the spaces A^s_q, embeddings,
# transfer theorems, Jackson and Bernstein inequalities and real interpolation. Nothing here
# mentions functions or measures.
[[lean_lib]]
name = "ApproximationSpaces"

# The function spaces and their characterisations: Besov, Triebel–Lizorkin, Sobolev and
# Bessel potential spaces on measure spaces, ℝ^d, the torus, intervals, the cube, Lipschitz
# domains and compact manifolds, and the theorems that their descriptions agree.
[[lean_lib]]
name = "FunctionSpaces"
